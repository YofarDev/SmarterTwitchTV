# Runs the web test harnesses and lint on every push/PR, and builds the APK on
# PRs and pushes to master, so a break surfaces at commit time instead of hiding
# until the next release (release.yml only runs at release time).
#
# The harness list lives in release/scripts/run-web-tests.js so CI and `npm test`
# never drift apart. phonechat-server-tests (Android SDK) and phonechat-browser-tests
# (playwright + Chrome) stay out — see the comments there.
name: CI

on:
  push:
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

#Actions are pinned by commit SHA (the tag each resolved to), tags move

jobs:
  web:
    name: Web tests + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      #The Java fixtures (ad-filter, request-dispatcher, vod-chat-sync) compile and
      #run real APK Java, so the JDK must be up before the tests
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Version consistency
        run: node release/scripts/check-version-consistency.js

      - name: Test harnesses
        run: node release/scripts/run-web-tests.js

      - name: Lint (JSHint)
        run: node release/scripts/maker.js jsh

  #The expensive job only runs where it matters: every PR, and direct pushes to
  #master. Pushes to feature branches get the web job above (same-repo PRs are
  #covered by their PR event once opened).
  apk:
    name: APK debug build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      #checkPhoneChatAssets (wired into preBuild) needs release/phonechat-assets
      - name: Generate web build output
        run: node release/scripts/maker.js

      - name: Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Clone the pinned Media3 fork (sibling of the repo, see apk/settings.gradle)
        run: |
          git clone $MEDIA_REPO $GITHUB_WORKSPACE/../media
          git -C $GITHUB_WORKSPACE/../media checkout $MEDIA_REF
        env:
          MEDIA_REPO: https://github.com/fgl27/media
          MEDIA_REF: 4d0e6705a28d55c82787ed4c2870dd3efa8b5749

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
        working-directory: apk

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: debug-apk
          path: apk/app/build/outputs/apk/debug/*.apk
          retention-days: 7

      #Catches a forgotten local `maker.js` run before the stale release/ output
      #reaches master (allowed to fail until the repo settles into it)
      - name: Check release/ output is fresh
        run: |
          git diff --stat -- release/githubio
          if ! git diff --quiet -- release/githubio; then
            echo "::warning::release/githubio differs from the committed output — run node release/scripts/maker.js and commit"
          fi
        continue-on-error: true
